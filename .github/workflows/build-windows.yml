name: Build BR Snowball Impact
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ "README.md" ]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: Checkout source
      - name: Configure
        run: cmake -S . -B build -A x64 -DFFGL_BUILD_EXAMPLE_PLUGINS=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Verify FFGL plugin
        shell: pwsh
        run: |
          $dll="build/plugin/BR Snowball Impact.dll"
          if(-not(Test-Path $dll)){throw "Plugin DLL was not produced"}
          $dumpbin=Get-ChildItem "C:/Program Files/Microsoft Visual Studio/2022/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe"|Select-Object -Last 1
          $exports=& $dumpbin.FullName /EXPORTS $dll|Out-String
          if($exports -notmatch "plugMain"){throw "Invalid FFGL DLL"}
      - name: Prepare safe package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package,out|Out-Null
          Copy-Item "build/plugin/BR Snowball Impact.dll" "package/BR Snowball Impact.dll"
          Copy-Item README.md package/README.txt
          tar -czf "out/BR-Snowball-Impact-Windows-v0.1.1-beta.tar.gz" -C package .
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: BR-Snowball-Impact-Windows-v0.1.1-beta
          path: out/BR-Snowball-Impact-Windows-v0.1.1-beta.tar.gz
          if-no-files-found: error
